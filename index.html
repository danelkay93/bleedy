<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bleedy</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.5.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.5.1/core.js"></script>
    <link rel="stylesheet" href="./src/assets/handdrawn.css">

  </head>
  <body>
    <py-splashscreen>
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Cabin Sketch', sans-serif; background-color: #f0f0f0; color: #333;">
        <img src="/favicon.ico" alt="Bleedy Logo" style="width: 80px; height: 80px; margin-bottom: 20px;">
        <h2 style="font-size: 2em; margin-bottom: 10px;">Bleedy.py is loading...</h2>
        <p style="font-size: 1.2em;">Please wait while the bits and bytes get sketchy!</p>
        <!-- Optional: add a simple CSS spinner or animated SVG here if desired -->
      </div>
    </py-splashscreen>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script type="py" src="/pyscript/main.py" config="/pyscript/config.toml"></script>
    <div id="bleedy-output"></div>
  </body>
