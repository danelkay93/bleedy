name: CI Checks and Build

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-and-build:
    name: Validate and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Matches @tsconfig/node20
          cache: 'npm'

      - name: Validate package-lock.json
        run: |
          echo "Validating lock file sync..."
          bash scripts/validate-lockfile.sh

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint code
        run: npm run lint -- --no-fix # Ensure lint fails on error, not trying to fix in CI

      - name: Type check
        run: npm run type-check

      - name: Build project
        run: npm run build
