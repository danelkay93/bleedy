name: Lightweight CI - Quick Checks

# This workflow provides fast preliminary checks before the comprehensive Docker CI runs
# Primary CI is now handled by docker-compose.yml workflow

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quick-validation:
    name: Quick Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate lock file
        run: bash scripts/validate-lockfile.sh

      - name: Check for common issues
        run: |
          echo "Running quick validation checks..."
          
          # Check for TODO/FIXME comments in committed code
          if git diff --cached --name-only | xargs grep -n "TODO\|FIXME" 2>/dev/null; then
            echo "::warning::Found TODO/FIXME comments in changes"
          fi
          
          # Check for large files
          if git diff --cached --name-only | xargs du -h 2>/dev/null | awk '$1 ~ /M$/ && $1 > 1'; then
            echo "::warning::Found large files in changes"
          fi
          
          echo "✅ Quick validation complete"

      - name: Report status
        run: |
          echo "## Quick Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Lock file validation passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Basic checks passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Comprehensive CI checks run in the Docker CI workflow" >> $GITHUB_STEP_SUMMARY
