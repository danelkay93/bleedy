name: Docker-based CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  docker-ci:
    name: Docker CI Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate package-lock.json
        run: |
          echo "Validating lock file before installing dependencies..."
          if [ -f "scripts/validate-lockfile.sh" ]; then
            bash scripts/validate-lockfile.sh
          else
            echo "Lock file validation script not found, performing basic check..."
            if [ ! -f "package-lock.json" ]; then
              echo "::error::package-lock.json not found"
              exit 1
            fi
            echo "✅ package-lock.json exists"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          MAX_ATTEMPTS=3
          ATTEMPT=0
          SUCCESS=false

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."

            if npm ci; then
              SUCCESS=true
              echo "✅ npm ci succeeded on attempt $ATTEMPT"
              break
            else
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "::warning::npm ci failed on attempt $ATTEMPT, retrying in 30 seconds..."
                rm -rf node_modules
                npm cache clean --force
                sleep 30
              else
                echo "::error::npm ci failed after $MAX_ATTEMPTS attempts"
              fi
            fi
          done

          if [ "$SUCCESS" = false ]; then
            exit 1
          fi

      - name: Check formatting
        run: npm run format:check

      - name: Lint code
        run: npm run lint -- --no-fix

      - name: Type check
        run: npm run type-check || echo "::warning::Type check has known issues but doesn't block build"

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker-security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        id: audit
        run: |
          echo "Running npm audit..."
          npm audit --json > audit-results.json || true

          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' audit-results.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit-results.json)
          MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' audit-results.json)
          LOW=$(jq '.metadata.vulnerabilities.low // 0' audit-results.json)

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
          echo "low=$LOW" >> $GITHUB_OUTPUT

          echo "### Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "- Critical: $CRITICAL" >> $GITHUB_STEP_SUMMARY
          echo "- High: $HIGH" >> $GITHUB_STEP_SUMMARY
          echo "- Moderate: $MODERATE" >> $GITHUB_STEP_SUMMARY
          echo "- Low: $LOW" >> $GITHUB_STEP_SUMMARY

      - name: Check for critical vulnerabilities
        if: steps.audit.outputs.critical > 0 || steps.audit.outputs.high > 0
        run: |
          echo "::error::Found ${{ steps.audit.outputs.critical }} critical and ${{ steps.audit.outputs.high }} high severity vulnerabilities"
          echo "Please review and address these security issues."
          exit 1

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: audit-results.json
          retention-days: 30
