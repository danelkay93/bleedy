name: Azure Staging Cleanup

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (list environments without deleting)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  cleanup-staging:
    name: Cleanup Unused Staging Environments
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get open pull requests
        id: open_prs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            
            const prNumbers = prs.map(pr => pr.number);
            console.log(`Found ${prNumbers.length} open PRs: ${prNumbers.join(', ')}`);
            core.setOutput('pr_numbers', JSON.stringify(prNumbers));
            core.setOutput('pr_count', prNumbers.length);
            return prNumbers;

      - name: Identify staging environments to cleanup
        id: identify
        uses: actions/github-script@v7
        with:
          script: |
            const openPRs = JSON.parse('${{ steps.open_prs.outputs.pr_numbers }}');
            
            // Note: Azure Static Web Apps staging environments are automatically named
            // based on PR numbers. We identify which ones can be cleaned up.
            // This is a simplified version - actual implementation would query Azure API
            
            console.log('Open PRs that have staging environments:', openPRs);
            
            // Create a summary
            let summary = '## Staging Environment Cleanup Analysis\n\n';
            summary += `- Open PRs with active staging: ${openPRs.length}\n`;
            summary += `- Dry run mode: ${{ inputs.dry_run || 'false' }}\n\n`;
            
            if (openPRs.length === 0) {
              summary += '✅ No open PRs found - all staging environments can be cleaned up\n';
            } else {
              summary += '### Active Staging Environments\n';
              openPRs.forEach(pr => {
                summary += `- PR #${pr}\n`;
              });
            }
            
            core.summary.addRaw(summary);
            await core.summary.write();
            
            return summary;

      - name: Log cleanup action
        run: |
          echo "=== Azure Staging Cleanup ==="
          echo "Dry run mode: ${{ inputs.dry_run || 'false' }}"
          echo "Open PRs: ${{ steps.open_prs.outputs.pr_count }}"
          echo ""
          echo "Note: Azure Static Web Apps automatically cleans up staging"
          echo "environments when PRs are closed. This workflow provides"
          echo "visibility into active staging environments."
          echo ""
          echo "To manually cleanup specific staging environments:"
          echo "1. Close the associated PR"
          echo "2. Use Azure Portal or Azure CLI"
          echo "3. Contact Azure support if limit issues persist"

      - name: Create cleanup report issue
        if: inputs.dry_run == 'false' && steps.open_prs.outputs.pr_count > 5
        uses: actions/github-script@v7
        with:
          script: |
            const openPRCount = ${{ steps.open_prs.outputs.pr_count }};
            
            if (openPRCount > 5) {
              const issueBody = `## ⚠️ High Number of Active Staging Environments\n\n` +
                `**Current Status:**\n` +
                `- Active staging environments: ${openPRCount}\n` +
                `- Azure Static Web Apps Free tier limit: 10 staging environments\n\n` +
                `**Action Required:**\n` +
                `1. Review and close stale PRs\n` +
                `2. Merge or close PRs that are no longer needed\n` +
                `3. Monitor the number of concurrent PRs\n\n` +
                `**Background:**\n` +
                `Azure Static Web Apps creates a staging environment for each PR. ` +
                `When the number of open PRs approaches the limit, new deployments may fail.\n\n` +
                `This issue was automatically created by the staging cleanup workflow.`;
              
              // Check if similar issue already exists
              const { data: existingIssues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'automation,infrastructure'
              });
              
              const hasExistingIssue = existingIssues.some(issue => 
                issue.title.includes('Active Staging Environments')
              );
              
              if (!hasExistingIssue) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `⚠️ High Number of Active Staging Environments (${openPRCount})`,
                  body: issueBody,
                  labels: ['automation', 'infrastructure']
                });
                console.log('Created cleanup report issue');
              } else {
                console.log('Similar issue already exists, skipping creation');
              }
            }
